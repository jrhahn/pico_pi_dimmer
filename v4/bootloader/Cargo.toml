[package]
name = "pico-dimmer-bootloader"
version = "1.0.0"
edition = "2024"
description = "embassy-boot bootloader: swaps in a downloaded update, rolls back one that never confirms"

[dependencies]
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl"] }
embassy-boot-rp = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
